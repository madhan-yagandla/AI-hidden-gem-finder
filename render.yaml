services:
  - type: web
    name: hidden-gem-explorer
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm rebuild sqlite3 --build-from-source && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
      - key: HF_API_KEY
        sync: false   # Set this manually in Render dashboard
      - key: HF_MODEL
        value: meta-llama/Llama-3.1-8B-Instruct:fastest
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
